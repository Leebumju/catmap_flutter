name: catmap_flutter
description: 봤냥 Flutter 이식 — 서버(Supabase)는 iOS 앱과 같은 것을 그대로 사용
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  bloc_concurrency: ^0.2.5
  collection: ^1.19.0
  equatable: ^2.0.5
  supabase_flutter: ^2.8.0
  intl: ^0.19.0
  shared_preferences: ^2.5.5
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  camera: ^0.12.0+2
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  exif: ^3.3.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  webview_flutter: ^4.14.1
  http: ^1.6.0
  url_launcher: ^6.3.2
  in_app_review: ^2.0.12
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    # iOS 앱의 Assets.xcassets 에서 그대로 가져온 것들.
    # cat-marker 는 2.0x / 3.0x 폴더에 해상도별 파일이 같이 있다.
    - assets/app-logo.png
    - assets/cat-marker.png
